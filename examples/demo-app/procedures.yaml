# Example project procedures (FAKE — design preview only).
# A procedure references its owning agent by id; model/effort come from that agent.

procedures:
  - id: run-test-gate
    name: "Run test gate"
    summary: "Run the suite and report pass/fail."
    owner: builder
    verified_by: tests
    read_only: true
    instructions: |
      Run the demo app's test suite. Report pass/fail totals; for any failure, the test name
      and the first relevant error line. Fix nothing — report only.
