# Atlas session procedures — the model + effort each KIND of work runs at.
#
# Token spend is governed by the session TYPE, not chosen per-dispatch. Pick the session type
# when dispatching; the dispatcher reads model + effort from here.
#
#   model:  opus | sonnet | haiku    (passed to the CLI as --model)
#   effort: low | medium | high      (shapes a reasoning/scope directive sent via
#                                     --append-system-prompt; high = think deeply + verify,
#                                     low = minimal correct change, be economical)
#
# ONE knob for the cost/performance trade-off across every project. Deciding this per-dispatch
# was the original design and it was wrong: the choice then gets made in the moment, under
# whatever pressure the moment carries, which is exactly when it should already be settled.
#
# The projects below are the fictional worked example (see registry.yaml).

defaults:
  model: sonnet
  effort: medium

projects:
  orchard-api:             # the backend service
    implementation:
      model: sonnet         # Sonnet BUILDS; the Opus scoper designs the contract and the reviewer gates it
      effort: high
      desc: "Feature / architecture / security work behind the pytest gate"
    plumbing:
      model: sonnet
      effort: medium
      desc: "Routine wiring — migrations, config, dependency bumps"

  orchard-site:            # the public website
    content:               # writing the guides — the human is the only truth check
      model: opus
      effort: high
      desc: "Guide curation against the written standard (the build validates form, never truth)"
    engineering:           # site plumbing, behind the build gate
      model: sonnet
      effort: medium
      desc: "Site + data engineering (templates, JSON data, build plumbing)"

  orchard-journal:         # the newsletter — human-gated, no test gate
    content:
      model: sonnet
      effort: high
      desc: "Drafting against a confirmed brief. No gate exists here by design — see automation-map.yaml"

  almanac:                 # the forecasting engine
    research:
      model: opus
      effort: high
      desc: "Model design, backtest analysis, gate verdicts"
    ingest:
      model: haiku
      effort: low
      desc: "Source ingestion / mechanical vault writes — cheap because a mistake is visible and re-runnable"
    ops:
      model: sonnet
      effort: medium
      desc: "Campaign ops, reporting, lint"

  # orchard-ops has no entry: its plan is almost entirely `type: manual`, so there is no
  # dispatched session type to price. Nothing to configure is a valid configuration.
