[pytest]
# `worktrees/` is the dispatch engine's sandbox root: the worker checks a project OUT into it,
# one directory per job. Those are OTHER PROJECTS' repos — client-app's tests, app-two's
# node_modules — so collecting them runs a foreign suite under Atlas's name, and a leftover from
# any one job fails `pytest` here with an import error that has nothing to do with Atlas.
#
# It bit twice on 2026-08-25: both full runs needed `--ignore=worktrees` passed by hand, which
# is exactly the kind of undocumented flag someone loses an afternoon to. A job's directory is
# also not always removable at cleanup time — an agent's dev server can still hold a file lock —
# so leftovers are a normal state to tolerate, not an anomaly to rely on never happening.
norecursedirs = worktrees .git __pycache__ node_modules
