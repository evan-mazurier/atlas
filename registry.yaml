# Atlas project registry: the projects Atlas watches. EXAMPLE entries.
# Atlas v2 reads only `id` and `plan_file` (cockpit/plan/model.py); the rest is kept as the record.
# To add a project: give it a plan.yaml and add an entry here.

projects:
  - id: consulting
    label: "Consulting"
    status_file: "D:\\AI\\consulting\\status.yaml"
    plan_file:   "D:\\AI\\consulting\\plan.yaml"
    aliases: ["consulting", "business"]
  - id: client-app
    parent: consulting
    label: "Client App"
    status_file: "D:\\AI\\client-app\\status.yaml"
    plan_file:   "D:\\AI\\client-app\\plan.yaml"
    aliases: ["client app"]
