# Atlas — Orchard UMBRELLA procedures (the middle tier).
#
# The umbrella's REPEATABLE operations, all owned by the vault-keeper. Named at the intent
# level in docs/agentic-structure.md; the architect authors the exact `instructions`
# here (it is the sole writer of procedures.yaml, umbrella included).
#
# Model/effort come from the owning agent (vault-keeper: opus / high). Each is rung 1.5:
# one draft → deterministic vault-lint (dashboard/vault.py:lint) → the operator approves. Never a loop,
# never an autonomous commit — the human gates every write to the source of truth. The vault
# lives at D:\work\orchard-vault\wiki (override ATLAS_VAULT); its conventions are in the vault's own CLAUDE.md.

id: orchard
procedures:
  - id: update-vault
    name: "Update the vault"
    summary: "Record or revise a decision/concept in the shared decision vault — propose, don't commit."
    owner: vault-keeper
    verified_by: human            # deterministic vault-lint is the pre-check; the operator is the content gate
    read_only: false              # write-intent: produces a proposed change, human-gated before commit
    instructions: |
      Manual vault write, on the operator's request (from the vault panel or via the receptionist).
      PROPOSE-ONLY: you draft + lint + surface; the operator approves and Atlas commits. Never commit yourself.

      1. UNDERSTAND the request — the exact decision/concept/change to record and WHY. If the intent
         is unclear, or the change is strategic and underspecified, ask the operator before drafting — you are
         writing the company's source of truth, so do not guess it.

      2. LOCATE the target. Search the vault (index.md + the ask-orchard retrieval) for the doc(s) this
         touches. Decide: edit an existing doc, create a new one, or supersede an old one. Reuse an
         existing doc before creating a near-duplicate; a change to a live decision usually edits it.

      3. DRAFT following the vault's conventions (the vault's own CLAUDE.md):
         - Filename `<type>_<slug>.md`; type ∈ {src, concept, entity, decision, synthesis, research};
           slug lowercase, hyphenated, no spaces.
         - Frontmatter: title · type · tags (reuse the core tag list before inventing) · created
           (today if new; keep the original if editing) · updated (today) · sources (raw/ paths or URLs).
         - Body: for a decision, the chosen option + rationale + alternatives considered. Cross-
           reference related docs with `[[slug]]` (filename stem, no `.md`).
         - SUPERSEDE, don't delete: if this change overrides a prior decision, add a ⛔ SUPERSEDED
           banner to the TOP of the old doc with a `[[<new-doc>]]` successor link, and have the new
           doc point back. (vault.py detects the banner; Ask Orchard then redirects instead of answering stale.)
         - Maintain the catalog: add/adjust the one-line index.md entry (`- [[slug]] — description`,
           grouped by category) and stage a log.md line (`[YYYY-MM-DD HH:MM] OPERATION | <desc>`).

      4. RUN THE DETERMINISTIC VAULT-LINT (dashboard/vault.py:lint) over the proposed vault state. It must
         report no NEW issues: frontmatter parses to a mapping, opening `---` has a closing `---`, files
         read as strict UTF-8, and every `[[link]]` resolves to a real doc id. If it fails, FIX the draft
         and re-lint. If it still fails or the cause is outside this change, STOP and hard-escalate to
         The operator with the issue list — do not surface a proposal that fails lint.

      5. SURFACE THE PROPOSAL (not a commit). Emit: a one-paragraph change-summary (what's added/changed
         X→Y and why), the list of files touched, the clean lint result, and the full draft/diff collapsed
         one click away. For the manual path this appears inline in the vault panel's right sidebar with
         approve/reject. STOP. The operator approves → Atlas commits the approved change to the vault; the operator edits/
         rejects → revise on his feedback and re-run from step 3. Never commit on your own.

  - id: refresh-north-star
    name: "Refresh the north-star"
    summary: "Edit concept_orchard-northstar.md — the distilled mission + guardrails behind the hub strip. Propose, don't commit."
    owner: vault-keeper
    verified_by: human            # vault-lint + the mission/guardrails frontmatter contract; the operator is the gate
    read_only: false
    instructions: |
      Edit exactly ONE doc — `concept_orchard-northstar.md` — the distilled north-star card. Same gated,
      propose-only discipline as update-vault, plus north-star-specific rules. High-stakes: this is the
      company's decision filter and the root of the vault graph.

      1. SCOPE. This doc is SHORT and DISTILLED: a one-line mission + the guardrail set, linking to
         `[[concept_orchard-company]]` for the full vision. Distill, don't duplicate — depth belongs in
         concept_orchard-company, not here. Keep it compact: the `◇ North Star` hub strip must not make
         the Orchard hub scroll (Decision 5). This procedure never edits any other doc; a broader change
         goes through update-vault.

      2. UNDERSTAND the requested change (mission wording, add/remove/reword a guardrail, current-focus
         update). Because this is the company's source-of-truth root, CONFIRM the exact wording with the operator
         before drafting whenever the change is substantive or strategic — a north-star edit is not routine.

      3. DRAFT the edit, preserving the doc's structure:
         - Frontmatter MUST keep the special `mission:` (string) and `guardrails:` (list of strings)
           fields — the control center hub strip reads them via vault.py:northstar(); dropping or malforming
           them breaks the strip. Also keep title · type: concept · tags · created (original) · updated
           (today) · sources.
         - Body: the distilled card + guardrails; keep the `[[concept_orchard-company]]` link intact.
         - If the current-focus line changes, update it here; the full rationale stays in the linked vision doc.

      4. RUN THE VAULT-LINT (dashboard/vault.py:lint) — must pass — AND verify the north-star still exposes
         NON-EMPTY `mission` + `guardrails` frontmatter (call vault.py:northstar and confirm ok:true with
         both fields populated). If either is missing or malformed, fix and re-lint before surfacing.

      5. SURFACE THE PROPOSAL (change-summary + full draft collapsed + clean lint result). Because this is
         the root of truth, ALWAYS present the exact new wording (expandable) for the operator to read, not just the
         summary. STOP. The operator approves → Atlas commits; edits/rejects → revise. Never auto-commit.

  - id: propose-updates-from-a-merged-session
    name: "Propose updates from a merged session"
    summary: "After a Orchard sub-project merges, judge whether the vault should record a decision — usually not; if so, draft it to Pending."
    owner: vault-keeper
    verified_by: human            # vault-lint pre-check; the operator approves from the Pending tab
    read_only: false
    instructions: |
      The AUTO path. Fired by the deterministic post-merge hook after a Orchard SUB-PROJECT session merges
      (a cheap triage has already decided the merge is worth your attention). The operator is NOT watching, so any
      proposal must stand on its own. PROPOSE-ONLY: draft + lint + surface to Pending; the operator commits.

      1. INPUT: the just-merged session — its task/contract and its merged diff, plus which sub-project it was.

      2. JUDGE FIRST (the cheap, default-silent step). Ask: did this session MAKE or REVEAL a decision the
         company source of truth should record — a product / architecture / strategy choice, the superseding
         of a prior decision, or a new evergreen concept worth a page? Routine implementation, refactors,
         bug-fixes, dependency bumps, and minor content tweaks are NOT decision-worthy. The DEFAULT and most
         common verdict is NO → STOP immediately: emit no proposal, add no noise. Continue only when there is
         a genuine, nameable decision.

      3. If yes, DRAFT the vault change using the SAME discipline as update-vault (naming, frontmatter, tags,
         `[[links]]`, index.md + log.md, supersede-don't-delete). Scope it to what the merge actually decided —
         nothing more — and cite the sub-project + the merge in `sources`.

      4. RUN THE VAULT-LINT (dashboard/vault.py:lint); it must be clean (fix + re-lint on any new issue). Never
         surface a proposal that fails lint.

      5. SURFACE TO THE PENDING TAB as a proposal, using the same confirm-card the architect/planner produce
         (confirmProposalHTML: change-summary on top, full draft/diff collapsed). Because the operator wasn't there,
         the summary must name the sub-project, the decision, and why it's worth recording. STOP — do not
         commit. The operator approves from Pending → Atlas commits to the vault; the operator dismisses → no write.
